name: Build & Release APK

# Un seul workflow, deux jobs :
#  - build   : APK debug à chaque push (toutes les branches) et en lancement manuel.
#  - release : APK release signé + publication GitHub Release, uniquement sur main
#              (push, ou lancement manuel avec "release" coché), une fois le build réussi.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version de base (ex : 1.0)"
        required: true
        default: "1.0"
      notes:
        description: "Nouveautés affichées dans l'application (une par ligne)"
        required: false
        default: ""
      release:
        description: "Publier une release (depuis main uniquement)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ───────────────────────── BUILD DEBUG ─────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Un nouveau push sur la même branche annule le build précédent encore en cours.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      code: ${{ steps.ver.outputs.code }}
      name: ${{ steps.ver.outputs.name }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # corr-044 : scan des dépendances contre la base OSV (vulnérabilités connues).
      # Non bloquant tant que le traitement du rapport est en cours ; l'artefact
      # osv-report conserve le détail.
      - name: Scan vulnérabilités dépendances (osv-scanner)
        continue-on-error: true
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner || true
          chmod +x osv-scanner 2>/dev/null || true
          if [ -x ./osv-scanner ]; then
            ./osv-scanner scan source --lockfile gradle/libs.versions.toml --format json > osv-report.json || true
          else
            echo "::warning::osv-scanner indisponible — scan ignoré"
            echo '{}' > osv-report.json
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # MA46/MA47 : actions aux dernières versions majeures (vérifiées par git ls-remote)
      # et ./gradlew au lieu de gradle-version → même version Gradle en local et en CI,
      # cache des dépendances (jitpack inclus) géré par setup-gradle (MA48).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculer la version
        id: ver
        shell: bash
        env:
          BASE_VERSION: ${{ inputs.version || '1.0' }}
        run: |
          set -euo pipefail
          # err-005 : message explicite — format attendu + exemples.
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version invalide : « $BASE_VERSION » — format attendu majeur.mineur[.patch][suffixe] ; exemples valides : 1.0, 1.2.3, 1.0-beta.1 (err-005)"
            exit 1
          fi

          # Le nombre de commits donne un versionCode croissant commun aux builds et releases.
          CODE=$(git rev-list --count HEAD)
          if (( CODE < 1 || CODE > 2100000000 )); then
            echo "::error::versionCode hors limites Android : $CODE"
            exit 1
          fi

          NAME="${BASE_VERSION}-b${CODE}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (versionCode $CODE)"

      - name: Préparer la signature
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # MA49 : le build debug ne doit pas échouer sans secrets — repli sur un
          # keystore debug généré à la volée ; le job release reste strict.
          if [[ -z "${KS_B64:-}" ]]; then
            echo "::warning::KEYSTORE_BASE64 absent : keystore debug généré pour ce build."
            KS="$RUNNER_TEMP/debug-fallback.keystore"
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ZAgent Debug, O=ZAgent, C=FR"
            {
              echo "KEYSTORE_PATH=$KS"
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_PASSWORD=android"
              echo "KEY_ALIAS=androiddebugkey"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore" || {
            echo "::error::Le keystore décodé est vide"
            exit 1
          }
          # err-004 : valide le keystore et nomme la cause (corrompu / mauvais mot de passe).
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" >/dev/null 2>&1; then
            if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass android >/dev/null 2>&1; then
              echo "::error::Keystore rejeté : KEYSTORE_PASSWORD ne correspond pas au mot de passe du keystore (err-004)"
            else
              echo "::error::Keystore corrompu ou illisible : recrée-le puis remplace le secret KEYSTORE_BASE64 (err-004)"
            fi
            exit 1
          fi

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            # corr-047 : KEY_PASSWORD dérivé de KS_PASS, pas re-déclaré
            echo "KEY_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }} 2>&1 | tee build.log

      # MA55 : tests unitaires en CI avec publication du rapport.
      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest

      - name: Rapport de tests (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # MA56 : lint informatif avec rapport HTML en artefact.
      - name: Lint (informatif)
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Rapport lint (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # corr-044 : le rapport du scan OSV est conservé en artefact.
      - name: Rapport scan OSV (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-report
          path: osv-report.json
          if-no-files-found: ignore

      # err-006 : en cas d'échec, exporte l'arbre de dépendances et dependencyInsight
      # (conflits / classes en double) pour l'analyse hors ligne.
      - name: Diagnostic dépendances (échec)
        if: failure()
        continue-on-error: true
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > deps.log 2>&1 || true
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath > deps-insight.log 2>&1 || true

      - name: Rapport dépendances (artefact)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: |
            deps.log
            deps-insight.log
          if-no-files-found: ignore

      # err-002 : annotations lisibles — fichier/ligne/colonne extraits de
      # « e: file://…:L:C message » pour apparaître directement sur le commit.
      - name: Rapport erreurs compilation
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: file" build.log | head -30 | while IFS= read -r l; do
              REST="${l#e: file://}"
              F="${REST%%.kt*}.kt"
              LINE="$(echo "$REST" | cut -d: -f2)"
              COL="$(echo "$REST" | cut -d: -f3)"
              MSG="$(echo "$REST" | cut -d' ' -f2-)"
              [[ "$LINE" =~ ^[0-9]+$ ]] || LINE=1
              [[ "$COL" =~ ^[0-9]+$ ]] || COL=1
              [[ -n "$F" && "$F" != ".kt" ]] || F="build.log"
              echo "::error file=$F,line=$LINE,endLine=$LINE,col=$COL,title=Compilation Kotlin::${MSG:0:400}"
            done
            grep -E "^error: " build.log | head -20 | while IFS= read -r l; do
              echo "::error::${l:0:500}"
            done
            grep -qE "^e: file|^error: " build.log || tail -12 build.log | while IFS= read -r l; do
              echo "::error::${l:0:400}"
            done
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ───────────────────────── RELEASE SIGNÉE ─────────────────────────
  release:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # MA57 : la publication passe par l'environnement GitHub « production »
    # (règles de protection / relecteurs configurables côté dépôt).
    environment: production
    # Les releases se publient une par une ; si main avance, seule la dernière en attente est gardée.
    concurrency:
      group: zagent-release
      cancel-in-progress: false
    env:
      RELEASE_NOTES: ${{ inputs.notes || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Vérifier et préparer la signature
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # err-003 : quand un secret manque, explique comment le créer (commandes exactes).
          if [[ -z "${KS_B64:-}" || -z "${KS_PASS:-}" || -z "${KS_ALIAS:-}" ]]; then
            echo "::error::Secrets de signature manquants (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS) — les créer ainsi (err-003) :"
            echo "::error::1) keytool -genkeypair -v -keystore release.keystore -storepass <mdp> -keypass <mdp> -alias <alias> -keyalg RSA -keysize 2048 -validity 10000"
            echo "::error::2) base64 -w0 release.keystore > release.b64"
            echo "::error::3) gh secret set KEYSTORE_BASE64 < release.b64 ; gh secret set KEYSTORE_PASSWORD ; gh secret set KEY_ALIAS"
            exit 1
          fi

          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore" || {
            echo "::error::Le keystore décodé est vide"
            exit 1
          }
          # err-004 : valide le keystore et nomme la cause (corrompu / mauvais mot de passe).
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" >/dev/null 2>&1; then
            if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass android >/dev/null 2>&1; then
              echo "::error::Keystore rejeté : KEYSTORE_PASSWORD ne correspond pas au mot de passe du keystore (err-004)"
            else
              echo "::error::Keystore corrompu ou illisible : recrée-le puis remplace le secret KEYSTORE_BASE64 (err-004)"
            fi
            exit 1
          fi

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            # corr-047 : KEY_PASSWORD dérivé de KS_PASS, pas re-déclaré
            echo "KEY_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint (informatif)
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Build release signé
        run: ./gradlew assembleRelease -PversionName=${{ needs.build.outputs.name }} -PversionCode=${{ needs.build.outputs.code }}

      - name: Nommer l'APK et calculer le SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Aucun APK release généré"
            exit 1
          fi

          OUT="ZAgent-${{ needs.build.outputs.tag }}.apk"
          cp "$APK" "dist/$OUT"
          (cd dist && sha256sum "$OUT" > "$OUT.sha256")
          cat "dist/$OUT.sha256"

      - name: Vérifier la signature de l'APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner introuvable"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/ZAgent-${{ needs.build.outputs.tag }}.apk"

      - name: Archiver les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: zagent-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Notes de version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > notes.md
          elif git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^)"
            git log "$PREVIOUS_TAG..HEAD" --pretty=format:'- %s%n' > notes.md
          else
            git log -5 --pretty=format:'- %s%n' > notes.md
          fi
          test -s notes.md || git log -1 --pretty=format:'- %s%n' > notes.md

      - name: Publier la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ZAgent ${{ needs.build.outputs.name }}"
          body_path: notes.md
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
          make_latest: true
